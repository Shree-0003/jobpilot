name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Configure test environment
        run: |
          cat > .env.local <<ENV
          APP_ORIGIN=http://localhost:3000
          MONGODB_URI=mongodb://127.0.0.1:27017
          MONGODB_DB=jobpilot_e2e
          MASTER_KEY=$(openssl rand -base64 32)
          OLLAMA_URL=http://127.0.0.1:11434
          OLLAMA_MODEL=qwen2.5:3b
          OLLAMA_TIMEOUT_MS=30000
          MCP_GMAIL_COMMAND=node
          MCP_GMAIL_ARGS=$PWD/tests/mocks/mock-gmail-mcp.mjs
          ENV
      - run: npx next build
      - name: Start mock Ollama
        run: |
          nohup node tests/mocks/mock-ollama.mjs > mock-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:11434/ && exit 0
            sleep 1
          done
          echo "mock-ollama did not start"; cat mock-ollama.log; exit 1
      - name: Start e2e server
        run: bash ./scripts/e2e-server.sh
      - run: npx playwright test --reporter=list
      - name: Dump logs on failure
        if: failure()
        run: |
          cat mock-ollama.log || true
          ls *.log 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobpilot:ci .
      - name: Validate compose (host and bundled Ollama, GPU override)
        run: |
          cp .env.example .env
          KEY=$(openssl rand -base64 32)
          sed -i "s|^MASTER_KEY=.*|MASTER_KEY=${KEY}|; s|^MONGO_PASSWORD=.*|MONGO_PASSWORD=ci|" .env
          docker compose config -q
          COMPOSE_PROFILES=bundled-ollama docker compose config --services | grep -q ollama
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
      - name: Smoke test full stack (bundled Ollama, no model download)
        run: |
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=bundled-ollama/; s|^OLLAMA_URL=.*|OLLAMA_URL=http://ollama:11434|' .env
          docker compose up -d app mongo ollama
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || true)
            echo "attempt $i: HTTP $code"
            # 200 or 401 both mean the app is up; 000/5xx mean it is not
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 3
          done
          echo "---- last response body ----"; cat /tmp/body.txt || true
          echo "---- app logs ----"
          docker compose logs --tail 150 app
          exit 1
