# JobPilot on your laptop: app + MongoDB. Only the app is published, on localhost.
#
# Works on any Docker host. Easiest: ./setup.sh (Linux/macOS) or start-jobpilot.ps1 (Windows).
#  - Ollama installed on the machine:  OLLAMA_URL=http://host.docker.internal:11434            (default)
#  - Ollama inside Docker:             OLLAMA_URL=http://ollama:11434 + COMPOSE_PROFILES=bundled-ollama in .env
#  - NVIDIA GPU:                       add -f docker-compose.gpu.yml
name: jobpilot

services:
  app:
    build: .
    image: jobpilot:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://jobpilot:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin
      MONGODB_DB: jobpilot
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      STORAGE_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"   # set APP_BIND=0.0.0.0 only behind a firewall / reverse proxy
    volumes:
      - resumes:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mongo: { condition: service_healthy }
      ollama: { condition: service_started, required: false }
    networks: [front, back]

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: jobpilot
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    command: ["--bind_ip_all", "--auth"]
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [back]          # not published to the host

  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    networks: [back, egress]  # not published to the host

  ollama-pull:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c", "sleep 3 && OLLAMA_HOST=ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    networks: [back]
    restart: "no"

networks:
  front: {}
  back:
    internal: true             # mongo is reachable only from the app
  egress: {}

volumes:
  mongo: {}
  ollama: {}
  resumes: {}
